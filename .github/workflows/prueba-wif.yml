# Prueba TEMPORAL de la condicion del provider WIF de produccion (SeguridadGeneral).
# No despliega nada: solo intenta intercambiar el token OIDC por un token de acceso de la
# cuenta de despliegue y deja el resultado en el resumen. No imprime tokens.
name: prueba-wif
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sin-env:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Intentar la identidad de produccion SIN Environment
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        continue-on-error: true
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_DEPLOY_PROD }}
          token_format: access_token
      - name: Resultado
        env:
          RESULTADO: ${{ steps.auth.outcome }}
          FASE: ${{ vars.FASE }}
          EVENTO: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          echo "### sin-env | fase=${FASE} | evento=${EVENTO} | ref=${REF} | resultado=${RESULTADO}" >> "$GITHUB_STEP_SUMMARY"
          echo "RESULTADO sin-env: ${RESULTADO} (fase=${FASE}, evento=${EVENTO}, ref=${REF})"
  con-env:
    if: ${{ vars.FASE == 'A' && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Intentar la identidad de produccion CON Environment production
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        continue-on-error: true
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_DEPLOY_PROD }}
          token_format: access_token
      - name: Resultado
        env:
          RESULTADO: ${{ steps.auth.outcome }}
          FASE: ${{ vars.FASE }}
          EVENTO: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          echo "### con-env | fase=${FASE} | evento=${EVENTO} | ref=${REF} | resultado=${RESULTADO}" >> "$GITHUB_STEP_SUMMARY"
          echo "RESULTADO con-env: ${RESULTADO} (fase=${FASE}, evento=${EVENTO}, ref=${REF})"
